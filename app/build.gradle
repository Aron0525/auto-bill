plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aron.autobill'
    compileSdk 34

    defaultConfig {
        applicationId "com.aron.autobill"
        minSdk 23
        targetSdk 34
        versionCode 11
        versionName "2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Material Design Components：卡片、工具栏、FAB、Chip、对话框等组件与主题
    implementation 'com.google.android.material:material:1.11.0'
    // ML Kit 中文文字识别（bundled，本地运行，不联网不上传图片）
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.0'
}
